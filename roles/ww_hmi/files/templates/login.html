<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AquaView HMI - Control Room Login</title>
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
      background:radial-gradient(1200px 600px at 50% -10%,#15293a,#0b1016);
      color:#cdd9e5;font:14px/1.45 "Segoe UI",Roboto,Arial,sans-serif}
    .card{background:#121a24;border:1px solid #1f2d3a;border-radius:10px;padding:30px 34px;width:340px;
      box-shadow:0 20px 60px rgba(0,0,0,.45)}
    .brand{font-size:22px;font-weight:700;color:#fff;margin-bottom:2px}
    .brand small{color:#19b2c9}
    .sub{color:#7c8da0;font-size:12px;margin-bottom:22px}
    label{display:block;font-size:12px;color:#7c8da0;margin:12px 0 5px;text-transform:uppercase;letter-spacing:.5px}
    input{width:100%;padding:10px 12px;background:#0b1016;border:1px solid #1f2d3a;border-radius:6px;color:#fff;font-size:14px}
    input:focus{outline:none;border-color:#19b2c9}
    button{width:100%;margin-top:20px;padding:11px;background:#19b2c9;border:0;border-radius:6px;
      color:#042;font-weight:700;font-size:14px;cursor:pointer}
    button:hover{background:#2cc6dd}
    .err{background:rgba(229,72,77,.16);border:1px solid #e5484d;color:#ffb3b6;
      padding:9px 12px;border-radius:6px;font-size:13px;margin-bottom:8px}
    .foot{color:#55687a;font-size:11px;text-align:center;margin-top:20px}
  </style>
</head>
<body>
  <form class="card" method="post" autocomplete="off">
    <div class="brand">Aqua<small>View</small></div>
    <div class="sub">SCADA HMI &middot; ww-hmi01 &middot; Control Room Access</div>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <label for="u">Username</label>
    <input id="u" name="username" autofocus>
    <label for="p">Password</label>
    <input id="p" name="password" type="password">
    <button type="submit">Sign in</button>
    <div class="foot">Authorized operators only. Shared control-room login per plant SOP.</div>
  </form>
</body>
</html>
