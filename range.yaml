router:
  vm_name: "{{ range_id }}-router-debian12-x64"
  hostname: "{{ range_id }}-router"
  template: debian-12-x64-server-template
  ram_gb: 2
  ram_min_gb: 1
  cpus: 2

# ============================================================================
#  Networking — Purdue-style segmentation enforced on the Ludus router.
#
#  How Ludus applies these (verified against ludus-server firewall tasks):
#   * Every rule is INSERTED at the top of its chain, so the LAST rule listed
#     is evaluated FIRST. Broad rules go first, narrow exceptions after.
#   * Rules whose vlan_src/vlan_dst is `wireguard` go to LUDUS_DEFAULTS, which
#     is evaluated before LUDUS_USER_RULES (all other rules).
#   * RELATED/ESTABLISHED return traffic is always allowed (stateful).
#   * WireGuard clients granted range access are ACCEPTed to every VLAN by
#     default; the REJECTs below take that away for VLANs 20-50.
# ============================================================================
network:
  inter_vlan_default: REJECT        # zero-trust between zones; only flows below are allowed
  external_default: ACCEPT          # VMs need apt during deploy (see SETUP.md §6 to lock OT egress)
  wireguard_vlan_default: REJECT    # range hosts cannot open connections to players by default
  always_blocked_networks:
    - 10.0.0.0/24                   # EDIT: the LAN your Ludus host lives on

  rules:
    # ------------------------------------------------------------------------
    #  Players (WireGuard = "the internet"): DMZ + scoreboard only
    # ------------------------------------------------------------------------
    - name: "WG: block Corporate IT (VLAN 20)"
      vlan_src: wireguard
      vlan_dst: 20
      protocol: all
      ports: all
      action: REJECT
    - name: "WG: block OT DMZ (VLAN 30)"
      vlan_src: wireguard
      vlan_dst: 30
      protocol: all
      ports: all
      action: REJECT
    - name: "WG: block SCADA (VLAN 40)"
      vlan_src: wireguard
      vlan_dst: 40
      protocol: all
      ports: all
      action: REJECT
    - name: "WG: block Field controllers (VLAN 50)"
      vlan_src: wireguard
      vlan_dst: 50
      protocol: all
      ports: all
      action: REJECT
    # (WireGuard -> VLAN 10 and VLAN 60 stay allowed by the Ludus access grant.)
    - name: "DMZ web server egress to players (callbacks / C2)"
      vlan_src: 10
      ip_last_octet_src: 10
      vlan_dst: wireguard
      protocol: all
      ports: all
      action: ACCEPT
    - name: "WS01 phishing beacon egress to players (C2)"
      vlan_src: 20
      ip_last_octet_src: 30
      vlan_dst: wireguard
      protocol: all
      ports: all
      action: ACCEPT

    # ------------------------------------------------------------------------
    #  Internet DMZ <-> Corporate IT
    # ------------------------------------------------------------------------
    - name: "DMZ: ww-web01 -> ww-fs01 SMB (CCR report sync)"
      vlan_src: 10
      ip_last_octet_src: 10
      vlan_dst: 20
      ip_last_octet_dst: 10
      protocol: tcp
      ports: "445"
      action: ACCEPT
    - name: "DMZ: ww-web01 -> Corp SSH (CHG-2023-114 temp migration rule - REMOVE AFTER CUTOVER)"
      vlan_src: 10
      ip_last_octet_src: 10
      vlan_dst: 20
      protocol: tcp
      ports: "22"
      action: ACCEPT
    - name: "Corp -> ww-web01 SSH/HTTP (web content management)"
      vlan_src: 20
      vlan_dst: 10
      ip_last_octet_dst: 10
      protocol: tcp
      ports: "22,80"
      action: ACCEPT

    # ------------------------------------------------------------------------
    #  Corporate IT -> OT DMZ (L4 -> L3.5)
    # ------------------------------------------------------------------------
    - name: "Corp -> ww-hist01 AquaHistorian web (trend viewing)"
      vlan_src: 20
      vlan_dst: 30
      ip_last_octet_dst: 10
      protocol: tcp
      ports: "8080"
      action: ACCEPT
    - name: "ww-it01 -> ww-jump01 SSH (IT admin remote access to OT)"
      vlan_src: 20
      ip_last_octet_src: 20
      vlan_dst: 30
      ip_last_octet_dst: 20
      protocol: tcp
      ports: "22"
      action: ACCEPT

    # ------------------------------------------------------------------------
    #  OT DMZ -> SCADA (L3.5 -> L2)
    # ------------------------------------------------------------------------
    - name: "ww-hist01 -> ww-hmi01 SCADA tag API (historian collection)"
      vlan_src: 30
      ip_last_octet_src: 10
      vlan_dst: 40
      ip_last_octet_dst: 10
      protocol: tcp
      ports: "80"
      action: ACCEPT
    - name: "ww-jump01 -> ww-hmi01 HMI web + VNC (remote operator support)"
      vlan_src: 30
      ip_last_octet_src: 20
      vlan_dst: 40
      ip_last_octet_dst: 10
      protocol: tcp
      ports: "80,5900"
      action: ACCEPT
    - name: "ww-jump01 -> ww-eng01 SSH (remote engineering)"
      vlan_src: 30
      ip_last_octet_src: 20
      vlan_dst: 40
      ip_last_octet_dst: 20
      protocol: tcp
      ports: "22"
      action: ACCEPT

    # ------------------------------------------------------------------------
    #  SCADA -> Field controllers (L2 -> L1)
    # ------------------------------------------------------------------------
    - name: "ww-hmi01 -> Field Modbus/TCP (SCADA polling)"
      vlan_src: 40
      ip_last_octet_src: 10
      vlan_dst: 50
      protocol: tcp
      ports: "502"
      action: ACCEPT
    - name: "ww-eng01 -> Field Modbus/TCP (engineering)"
      vlan_src: 40
      ip_last_octet_src: 20
      vlan_dst: 50
      protocol: tcp
      ports: "502"
      action: ACCEPT
    - name: "ww-eng01 -> Field PCOM/TCP 20256 (Unitronics engineering)"
      vlan_src: 40
      ip_last_octet_src: 20
      vlan_dst: 50
      protocol: tcp
      ports: "20256"
      action: ACCEPT
