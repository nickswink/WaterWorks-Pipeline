# yaml-language-server: $schema=https://docs.ludus.cloud/schemas/range-config.json
#
# ============================================================================
#  WaterWorks Pipeline Co. — Cedar Ridge Regional Transmission System
#  Red team ICS/OT range  (range ID: waterworks)
# ============================================================================
#  Purdue-aligned segments (10.<range>.<vlan>.<octet>):
#    VLAN 10  Internet DMZ        ww-web01   public website + contractor portal
#    VLAN 20  Corporate IT (L4)   ww-fs01    Samba file server
#                                 ww-it01    IT admin server
#    VLAN 30  OT DMZ (L3.5)       ww-hist01  AquaHistorian process historian
#                                 ww-jump01  OT remote-access jump host
#    VLAN 40  SCADA (L2/L3)       ww-hmi01   AquaView HMI (web + VNC)
#                                 ww-eng01   Engineering workstation
#    VLAN 50  Field (L1)          ww-plc01   Intake PS-1        (Modbus/TCP)
#                                 ww-plc02   WTP chemical feed  (Modbus/TCP + PCOM)
#                                 ww-rtu03   Hilltop booster PS (Modbus/TCP)
#    VLAN 60  Range services      ww-score   CTF scoreboard (out of scope)
#
#  Players connect over WireGuard and can reach ONLY VLAN 10 and VLAN 60.
#  Everything else is reached by pivoting. See README.md / docs/DESIGN.md.
# ============================================================================

defaults:
  snapshot_with_RAM: true
  stale_hours: 0
  ad_domain_functional_level: WinThreshold
  ad_forest_functional_level: WinThreshold
  # No Windows domain in this range; these are set only because the
  # `defaults` block must be complete. They are not the Ludus defaults.
  ad_domain_admin: wwp_da
  ad_domain_admin_password: "Unused#Domain-Admin-7731"
  ad_domain_user: wwp_user
  ad_domain_user_password: "Unused#Domain-User-7731"
  ad_domain_safe_mode_password: "Unused#SafeMode-7731"
  timezone: America/Chicago
  enable_dynamic_wallpaper: false

